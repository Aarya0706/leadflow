services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/leadflow.db
      CORS_ORIGINS: http://localhost:3000
      SEED_TIMEZONE: ${SEED_TIMEZONE:-Asia/Kolkata}
    volumes:
      - leadflow-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this must be reachable from the host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  leadflow-data:
